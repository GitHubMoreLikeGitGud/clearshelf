<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="990" viewBox="0 0 1480 990" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ClearShelf architecture</title>
<desc id="d">Open Food Facts, openFDA and UK FSA are read only through Zetaris Lightning REST tables and the clearance_usl Unified Semantic Layer. A gateway exposes named SQL templates to the agent server, where a Markovian investigation loop planned by Nemotron 3 Nano 4B on local Ollama gathers evidence, H-MEM and the World Model keep memory and history, deterministic verifiers and policy decide, and actions are executed only under a signed contract. Decisions are written to an ops store that Zetaris federates back, and the officer works in the UI.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5563"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5563"/></marker></defs>
<rect width="1480" height="990" fill="#FFFFFF"/>
<text x="30" y="46" font-size="26" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">ClearShelf: from public data to a signed clearance decision</text>
<text x="30" y="74" font-size="15" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">One machine: Zetaris in local Docker, the gateway and agent on 127.0.0.1, Nemotron in local Ollama. No cloud model calls.</text>
<rect x="280" y="110" width="360" height="540" rx="14" fill="#F6FBFB" stroke="#0E7C86" stroke-width="2.0" stroke-dasharray="7 5"/>
<rect x="990" y="110" width="460" height="680" rx="14" fill="#FAFAFC" stroke="#9AA3AF" stroke-width="2.0" stroke-dasharray="7 5"/>
<text x="30" y="150" font-size="11" font-weight="bold" font-style="normal" fill="#5F6670" text-anchor="start" letter-spacing="1.2">PUBLIC SOURCES</text>
<rect x="30" y="165" width="200" height="84" rx="10" fill="#F5F6F8" stroke="#8A8F98" stroke-width="2.0"/>
<text x="44" y="195" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Open Food Facts</text>
<text x="44" y="218" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">product API v2</text>
<text x="44" y="237" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">ODbL 1.0</text>
<rect x="30" y="265" width="200" height="84" rx="10" fill="#F5F6F8" stroke="#8A8F98" stroke-width="2.0"/>
<text x="44" y="295" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">openFDA</text>
<text x="44" y="318" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">food recall reports</text>
<text x="44" y="337" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">public domain (CC0)</text>
<rect x="30" y="365" width="200" height="84" rx="10" fill="#F5F6F8" stroke="#8A8F98" stroke-width="2.0"/>
<text x="44" y="395" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">UK FSA</text>
<text x="44" y="418" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">food allergy alerts</text>
<text x="44" y="437" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">Open Government Licence</text>
<text x="30" y="478" font-size="13" font-weight="normal" font-style="italic" fill="#52606D" text-anchor="start">Zetaris is the only</text>
<text x="30" y="496" font-size="13" font-weight="normal" font-style="italic" fill="#52606D" text-anchor="start">runtime path to them.</text>
<text x="300" y="138" font-size="11" font-weight="bold" font-style="normal" fill="#0B6670" text-anchor="start" letter-spacing="1.2">ZETARIS</text>
<text x="300" y="160" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Lightning 2.4.3.1, local Docker</text>
<rect x="300" y="175" width="320" height="110" rx="10" fill="#E7F4F5" stroke="#0E7C86" stroke-width="2.0"/>
<text x="314" y="205" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">REST tables, cached</text>
<text x="314" y="228" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">CLEARSHELF_OFF.off_&lt;gtin13&gt;</text>
<text x="314" y="247" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">30 catalogue + 10 eval-only products</text>
<text x="314" y="266" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">CLEARSHELF_FDA, CLEARSHELF_FSA</text>
<rect x="300" y="330" width="320" height="150" rx="10" fill="#E7F4F5" stroke="#0E7C86" stroke-width="2.0"/>
<text x="314" y="360" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">clearance_usl</text>
<text x="314" y="383" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">Unified Semantic Layer, 9 tables:</text>
<text x="314" y="402" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">products, recalls, alerts, allergens,</text>
<text x="314" y="421" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">recall links, decisions</text>
<text x="314" y="440" font-size="14" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">PK/FK + custom DQ rules gate CLEAR</text>
<rect x="300" y="530" width="320" height="100" rx="10" fill="#E7F4F5" stroke="#0E7C86" stroke-width="2.0"/>
<text x="314" y="560" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Ops REST tables, read live</text>
<text x="314" y="583" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">CLEARSHELF_OPS: decisions, recall links,</text>
<text x="314" y="602" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">extractions, market allergens</text>
<line x1="230" y1="207" x2="256" y2="207" stroke="#4A5563" stroke-width="2"/>
