name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: agent tests and type check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  gateway:
    name: gateway tests and onboarding dry run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r gateway/requirements-dev.txt
      - run: python -m pytest gateway/tests -q
      - run: python -m gateway.onboard --dry-run --offline

  meterless-conformance:
    name: Meterless conformance and upstream check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vendored engines are blob-identical to Meterless/Meterless@1742dec
        run: bash scripts/check-engines-upstream.sh
      - name: H-MEM
        working-directory: engines/hmem/reference
        run: |
          npm install
          npx tsx ../conformance/runner.ts
      - name: H-MEM conformance on ClearShelf's subclass (agent/src/memory/hmemFacade.ts)
        working-directory: engines/hmem/reference
        run: HMEM_IMPL=../../../agent/src/memory/hmemFacade.ts npx tsx ../conformance/runner.ts
      - name: Markovian
        working-directory: engines/markovian/reference
        run: |
          npm install
          npx tsx ../conformance/runner.ts
      - name: World Model and idempotency check
        working-directory: engines/world-model/reference
        run: |
          npm install
          npx tsx ../conformance/runner.ts
          npx tsx scripts/idempotency-check.ts
