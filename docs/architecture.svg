<text x="472" y="510" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">decisions read back</text>
<rect x="300" y="680" width="320" height="90" rx="10" fill="#EAF0F7" stroke="#3B5B85" stroke-width="2.0"/>
