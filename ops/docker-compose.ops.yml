# ClearShelf ops store: nginx serving data/ops/ (written atomically by the agent)
# to Zetaris as http://clearshelf-ops on the existing zetaris_default network.
#   docker compose -f ops/docker-compose.ops.yml up -d
name: clearshelf-ops
services:
  clearshelf-ops:
    image: nginx:1.27-alpine
    container_name: clearshelf-ops
    restart: unless-stopped
    volumes:
      - ../data/ops:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8792:80"
    networks:
      zetaris_default:
        aliases:
          - clearshelf-ops
networks:
  zetaris_default:
    external: true
