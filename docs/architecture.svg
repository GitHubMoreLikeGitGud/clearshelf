<rect x="700" y="330" width="190" height="150" rx="10" fill="#EAF0F7" stroke="#3B5B85" stroke-width="2.0"/>
<text x="714" y="360" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Zetaris gateway</text>
<text x="714" y="383" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">FastAPI + JDBC</text>
<text x="714" y="402" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">named SQL templates</text>
<text x="714" y="421" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">allowlist, registrar</text>
<text x="714" y="440" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">every query logged</text>
<polyline points="620,405 700,405" fill="none" stroke="#4A5563" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
<text x="660" y="395" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="middle">JDBC</text>
