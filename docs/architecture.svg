<text x="1024" y="243" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">facts + officer rulings</text>
<text x="1024" y="262" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">conflicts always queued</text>
<text x="1024" y="281" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">ledger, approved dreams</text>
<rect x="1225" y="175" width="205" height="120" rx="10" fill="#F1EDFA" stroke="#6B4FBB" stroke-width="2.0"/>
<text x="1239" y="197" font-size="11" font-weight="bold" font-style="normal" fill="#5A3FA8" text-anchor="start" letter-spacing="1.2">METERLESS</text>
<text x="1239" y="220" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">World Model</text>
<text x="1239" y="243" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">products, brands, firms,</text>
<text x="1239" y="262" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">notices, allergens</text>
<text x="1239" y="281" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">timeline: what we knew</text>
<rect x="1010" y="330" width="420" height="150" rx="10" fill="#F1EDFA" stroke="#6B4FBB" stroke-width="2.0"/>
<text x="1024" y="352" font-size="11" font-weight="bold" font-style="normal" fill="#5A3FA8" text-anchor="start" letter-spacing="1.2">METERLESS  +  NVIDIA</text>
<text x="1024" y="375" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Markovian investigation loop</text>
<text x="1024" y="398" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">bounded chunks, carried state of at most 768 tokens</text>
<text x="1024" y="417" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">planner: Nemotron chooses the next tool</text>
<text x="1024" y="436" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">NEEDS_TOOL executor runs it through the gateway</text>
<text x="1024" y="455" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">untrusted text wrapped by the Scout guard</text>
<rect x="1010" y="510" width="205" height="120" rx="10" fill="#F2F8E6" stroke="#76B900" stroke-width="2.0"/>
<text x="1024" y="532" font-size="11" font-weight="bold" font-style="normal" fill="#4B7700" text-anchor="start" letter-spacing="1.2">NVIDIA</text>
<text x="1024" y="555" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Nemotron 3 Nano 4B</text>
<text x="1024" y="578" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">local Ollama, Q4_K_M</text>
<text x="1024" y="597" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">plans, extracts spans</text>
<text x="1024" y="616" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">0 cloud model calls</text>
<rect x="1225" y="510" width="205" height="120" rx="10" fill="#EAF0F7" stroke="#3B5B85" stroke-width="2.0"/>
<text x="1239" y="532" font-size="11" font-weight="bold" font-style="normal" fill="#2F4A6E" text-anchor="start" letter-spacing="1.2">DETERMINISTIC</text>
<text x="1239" y="555" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Verifiers + policy</text>
<text x="1239" y="578" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">lexicon, jurisdiction,</text>
<text x="1239" y="597" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">GTIN, claim tester</text>
<text x="1239" y="616" font-size="14" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">rules R0 to R6 decide</text>
<rect x="1010" y="660" width="420" height="110" rx="10" fill="#F1EDFA" stroke="#6B4FBB" stroke-width="2.0"/>
<text x="1024" y="682" font-size="11" font-weight="bold" font-style="normal" fill="#5A3FA8" text-anchor="start" letter-spacing="1.2">SCOUT INTENT SUBSET, REIMPLEMENTED</text>
<text x="1024" y="705" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Signed actions</text>
<text x="1024" y="728" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">HOLD, BLOCK: applied automatically (the safe side)</text>
<text x="1024" y="747" font-size="14" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">CLEAR, RELEASE: officer-signed, single-use contract</text>
