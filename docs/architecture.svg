<text x="940" y="395" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="middle">tool call</text>
<text x="940" y="425" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="middle">rows + SQL</text>
<text x="1010" y="138" font-size="11" font-weight="bold" font-style="normal" fill="#5F6670" text-anchor="start" letter-spacing="1.2">AGENT SERVER</text>
<text x="1010" y="160" font-size="17" font-weight="bold" font-style="normal" fill="#1F2933" text-anchor="start">Node 22 + TypeScript, 127.0.0.1:8790</text>
