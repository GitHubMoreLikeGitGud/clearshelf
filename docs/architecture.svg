<text x="314" y="733" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">data/ops/*.json, atomic writes</text>
<text x="314" y="752" font-size="14" font-weight="normal" font-style="normal" fill="#52606D" text-anchor="start">nginx, served as http://clearshelf-ops</text>
