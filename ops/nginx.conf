# Serves data/ops/*.json to Zetaris as http://clearshelf-ops/<name>.json on the
# zetaris_default Docker network. Read-only, JSON only, never cached, so every
# Zetaris query of an ops REST table reads the latest file.
server {
    listen 80;
    server_name clearshelf-ops;
    root /usr/share/nginx/html;
    autoindex off;
    sendfile off;
    open_file_cache off;
    etag off;
    if_modified_since off;

    location ~ ^/[A-Za-z0-9_]+\.json$ {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
